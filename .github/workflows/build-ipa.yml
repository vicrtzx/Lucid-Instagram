name: Build Lucid Instagram IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lucid Instagram v1.2
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          brew install dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git pillow

      - name: Setup Theos & SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -Lo master.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Compile Lucid Insta Tweak
        run: |
          make clean
          make package FINALPACKAGE=1
          mkdir -p packages
          cp packages/*.deb packages/com.vicrtzx.lucidinsta.deb || true
          ls -lh packages/

      - name: Download Core Engine & Assets
        run: |
          curl -fsSL --retry 3 -o packages/ryukgram.deb "https://github.com/faroukbmiled/RyukGram/releases/download/v1.5.0/RyukGram_1.5.0_IG452.0.1_rootless.deb"
          curl -fsSL --retry 3 -o packages/NoPluginsPatch.dylib "https://github.com/faroukbmiled/RyukGram/releases/download/v1.5.0/NoPluginsPatch_v1.5.0.dylib"

          python3 extract_deb.py packages/ryukgram.deb packages/extracted
          cp packages/extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/RyukGram.dylib packages/
          cp -R "packages/extracted/var/jb/Library/Application Support/RyukGram.bundle" packages/
          rm -rf packages/extracted packages/ryukgram.deb

          # Remove nested software-FFmpeg frameworks (~36 MB) from resource bundle:
          # Instagram 452 already links its own @rpath/libavcodec.framework (FFmpeg 7 ABI),
          # and Lucid Insta uses native direct CDN HD streams (0% CPU re-encoding, clean sideload signing).
          rm -rf packages/RyukGram.bundle/*.framework
          strip -x packages/RyukGram.dylib packages/NoPluginsPatch.dylib || true

      - name: Download Base Instagram v452.0.0 Decrypted IPA
        run: |
          curl -fsSL --retry 3 -o packages/com.burbn.instagram.ipa "https://github.com/Omyxun/SCInsta/releases/download/i/com.burbn.instagram_452.0.0_und3fined.ipa"
          ls -lh packages/com.burbn.instagram.ipa

      - name: Brand, Slim, and Localize as Lucid Insta
        run: |
          python3 generate_icon.py
          python3 patch_lucid_insta.py

      - name: Inject Tweaks with Cyan
        run: |
          LUCID_DEB=$(ls packages/com.vicrtzx.lucidinsta*.deb | head -n 1)
          cyan -i packages/BaseInstagram-branded.ipa \
               -f packages/RyukGram.dylib packages/NoPluginsPatch.dylib packages/RyukGram.bundle "$LUCID_DEB" \
               -o Lucid-Instagram-v1.2.ipa \
               -c 9 -m 15.0 -du -w \
               -n "Lucid Insta"

          # Ensure zero residual .appex / SC_Info entries remain for free-account sideloading
          INJECT_TMP="$(mktemp -d)"
          unzip -q Lucid-Instagram-v1.2.ipa -d "$INJECT_TMP"
          APP_DIR="$(find "$INJECT_TMP/Payload" -maxdepth 1 -type d -name '*.app' | head -1)"
          if [ -n "$APP_DIR" ]; then
            find "$APP_DIR" -type d \( -name '*.appex' -o -name 'PlugIns' -o -name 'SC_Info' \) -prune -exec rm -rf {} +
            ldid -S "$APP_DIR" || true
            ( cd "$INJECT_TMP" && zip -qr -9 ../repacked.ipa Payload )
            mv "$INJECT_TMP/../repacked.ipa" Lucid-Instagram-v1.2.ipa
          fi
          rm -rf "$INJECT_TMP"

          ls -lh Lucid-Instagram-v1.2.ipa

      - name: Upload Lucid-Instagram-v1.2 IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucid-Instagram-v1.2
          path: Lucid-Instagram-v1.2.ipa
          retention-days: 1
          if-no-files-found: error
